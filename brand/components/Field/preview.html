<!-- @dsCard group="Instrument" height=420 subtitle="Labelled mono input with hint and error; type to validate" -->
<style>html,body{margin:0}.wrap{padding:24px 32px}.cap{font:700 .69rem/1.3 var(--font-display);letter-spacing:.15em;text-transform:uppercase;color:var(--vc-fg-muted);margin:0 0 14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}</style>
<section data-surface="paper"><div class="wrap"><p class="cap" data-vc-cap="paper surface"></p><div class="two">
<div class="vc-field"><label for="fg-p">Foreground hex</label><input id="fg-p" data-hex value="#6D23C8" maxlength="7" spellcheck="false" autocomplete="off" aria-describedby="fg-p-h fg-p-e"><p class="vc-field-hint" id="fg-p-h">Six-digit hex, with the #.</p><p class="vc-field-error" id="fg-p-e" aria-live="polite"></p></div>
<div class="vc-field"><label for="bg-p">Background hex</label><input id="bg-p" data-hex value="#F7F5" maxlength="7" spellcheck="false" autocomplete="off" aria-invalid="true" aria-describedby="bg-p-h bg-p-e"><p class="vc-field-hint" id="bg-p-h">Six-digit hex, with the #.</p><p class="vc-field-error" id="bg-p-e" aria-live="polite">Use six hex digits, for example #F7F5F2.</p></div></div></div></section>
<section data-surface="ink"><div class="wrap"><p class="cap" data-vc-cap="ink surface"></p><div class="two">
<div class="vc-field"><label for="fg-i">Foreground hex</label><input id="fg-i" data-hex value="#6D23C8" maxlength="7" spellcheck="false" autocomplete="off" aria-describedby="fg-i-h fg-i-e"><p class="vc-field-hint" id="fg-i-h">Six-digit hex, with the #.</p><p class="vc-field-error" id="fg-i-e" aria-live="polite"></p></div>
<div class="vc-field"><label for="bg-i">Background hex</label><input id="bg-i" data-hex value="#F7F5" maxlength="7" spellcheck="false" autocomplete="off" aria-invalid="true" aria-describedby="bg-i-h bg-i-e"><p class="vc-field-hint" id="bg-i-h">Six-digit hex, with the #.</p><p class="vc-field-error" id="bg-i-e" aria-live="polite">Use six hex digits, for example #F7F5F2.</p></div></div></div></section>
<script>(function(){var n={"core":"Core","ct-lab":"CT LAB","collision-lab":"Collision Lab"};function u(){var t=document.documentElement.getAttribute("data-theme")||"core";document.querySelectorAll("[data-vc-cap]").forEach(function(e){e.textContent=(n[t]||t)+" / "+e.getAttribute("data-vc-cap")})}u();new MutationObserver(u).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})})()</script>
<script>document.querySelectorAll("[data-hex]").forEach(function(i){i.addEventListener("input",function(){var ok=/^#[0-9a-fA-F]{6}$/.test(i.value);i.setAttribute("aria-invalid",ok?"false":"true");document.getElementById(i.id+"-e").textContent=ok?"":"Use six hex digits, for example #F7F5F2."})})</script>
